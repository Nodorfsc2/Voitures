<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Collection miniatures 1/18</title>
<style>
:root{--bg:#f4f4f2;--card:#fff;--ink:#1c1c1c;--muted:#6b6b6b;--line:#e2e2df;--accent:#c8102e;--chip:#ececea}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1f1f1f;--ink:#f0f0f0;--muted:#a0a0a0;--line:#333;--chip:#2c2c2c}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:20px 24px 12px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
h1{margin:0 0 4px;font-size:1.4rem;letter-spacing:.3px}
h1 small{font-weight:400;color:var(--muted);font-size:.9rem;margin-left:8px}
.other{font-size:.85rem;margin-left:14px;color:var(--accent);text-decoration:none;font-weight:600}
.other:hover{text-decoration:underline}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.bar label{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
select,input[type=search]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.9rem;min-width:150px}
input[type=search]{min-width:220px}
button.reset{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer;align-self:flex-end}
.stats{font-size:.85rem;color:var(--muted);margin-left:auto;align-self:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:5px 11px;border-radius:999px;background:var(--chip);border:1px solid transparent;font-size:.82rem;cursor:pointer;user-select:none}
.chip.on{background:var(--accent);color:#fff}
main{padding:20px 24px;max-width:1500px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.12)}
.card .img{aspect-ratio:4/3;background:#000;cursor:zoom-in;overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .fab{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.card .fab b{color:var(--accent)}
.card .title{font-weight:600;font-size:1rem;line-height:1.25}
.card .sub{font-size:.85rem;color:var(--muted)}
.card .meta{font-size:.8rem;color:var(--muted);margin-top:auto;padding-top:6px;display:flex;justify-content:space-between;align-items:baseline}
.price{font-weight:700;font-size:1.05rem;color:var(--ink)}
.price small{font-weight:400;color:var(--muted);font-size:.75rem;margin-left:4px}
.num{display:inline-block;background:var(--ink);color:var(--card);border-radius:4px;padding:0 6px;font-weight:700;font-size:.78rem;margin-right:6px}
.pid{display:inline-block;background:#e9d94a;color:#3a3200;border-radius:4px;padding:0 6px;font-weight:700;font-size:.78rem;margin-right:6px}
.empty{text-align:center;color:var(--muted);padding:60px 0}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:50;flex-direction:column;gap:10px}
#lb.on{display:flex}
#lb img{max-width:95vw;max-height:82vh;object-fit:contain;border-radius:6px}
#lb .cap{color:#fff;font-size:.95rem;text-align:center;max-width:90vw}
#lb .x{position:absolute;top:14px;right:20px;color:#fff;font-size:2rem;cursor:pointer;line-height:1}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:3rem;cursor:pointer;padding:0 18px;user-select:none;opacity:.7}
#lb .nav:hover{opacity:1}
#lb .prev{left:0}#lb .next{right:0}
footer{padding:16px 24px 30px;font-size:.78rem;color:var(--muted);text-align:center}
.tog{display:none}
@media (max-width:700px){
  header{position:static;padding:12px 14px 10px}
  h1{font-size:1.1rem}
  .tog{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.85rem;cursor:pointer;margin-top:8px}
  .tog.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .bar,.chips{display:none}
  header.open .bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  header.open .chips{display:flex}
  .bar label:has(#fQ){grid-column:1/-1}
  select,input[type=search]{min-width:0;width:100%}
  button.reset{align-self:end}
  .stats{grid-column:1/-1;margin-left:0;font-size:.8rem}
  main{padding:12px 10px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{min-width:0}
  .card .meta{flex-wrap:wrap;gap:2px 8px}
  .card .body{padding:9px 10px 10px}
  .card .title{font-size:.9rem}
  .card .sub,.card .meta{font-size:.76rem}
  .price{font-size:.95rem}
}
@media print{header{position:static}.card{break-inside:avoid}#lb,.bar,.chips{display:none!important}}
</style>
</head>

const DEFAULT_SORT = 'fab';
const SHOW_ETAT = '1' === '1';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uniq = k => [...new Set(DATA.map(d => d[k]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'fr',{numeric:true}));
const fill = (sel, vals) => vals.forEach(v => { const o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o); });
fill($('#fFab'), uniq('fab')); fill($('#fMarque'), uniq('marque')); fill($('#fCat'), uniq('cat')); fill($('#fEch'), uniq('echelle'));
if (!DATA.some(d=>d.pid)) document.querySelector('#fSort option[value="pid"]').remove();
$('#fSort').value = DEFAULT_SORT;

// chips fabricant (raccourci)
const chips = $('#chips');
const countBy = {}; DATA.forEach(d => countBy[d.fab]=(countBy[d.fab]||0)+1);
uniq('fab').forEach(f => { const c=document.createElement('span'); c.className='chip'; c.dataset.v=f; c.textContent=`${f} (${countBy[f]})`; c.onclick=()=>{ $('#fFab').value = ($('#fFab').value===f?'':f); render(); }; chips.appendChild(c); });

let view = [];
function render(){
  const fab=$('#fFab').value, marque=$('#fMarque').value, cat=$('#fCat').value, ech=$('#fEch').value, q=$('#fQ').value.trim().toLowerCase(), sort=$('#fSort').value;
  view = DATA.filter(d => (!fab||d.fab===fab) && (!marque||d.marque===marque) && (!cat||d.cat===cat) && (!ech||d.echelle===ech) &&
    (!q || [d.fab,d.ref,d.marque,d.modele,d.pilote,d.course,d.annee,d.num,d.notes,d.pid?'post-it '+d.pid:''].join(' ').toLowerCase().includes(q)));
  const cmp = {
    'fab': (a,b)=> a.fab.localeCompare(b.fab)|| a.ref.localeCompare(b.ref,undefined,{numeric:true}),
    'marque': (a,b)=> a.marque.localeCompare(b.marque)|| a.annee.localeCompare(b.annee),
    'annee': (a,b)=> a.annee.localeCompare(b.annee)|| a.marque.localeCompare(b.marque),
    'prix-': (a,b)=> b.prix-a.prix, 'prix+': (a,b)=> a.prix-b.prix,
    'pilote': (a,b)=> a.pilote.localeCompare(b.pilote),
    'pid': (a,b)=> (a.pid||9999)-(b.pid||9999),
  }[sort]; view.sort(cmp);
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.v===fab));
  $('#grid').innerHTML = view.map((d,i) => `
    <article class="card">
      <div class="img" data-i="${i}"><img loading="lazy" src="thumbs/${esc(d.thumb)}" alt="${esc(d.marque+' '+d.modele)}"></div>
      <div class="body">
        <div class="fab"><b>${esc(d.fab)}</b>${d.ref?' · réf. '+esc(d.ref):''} · ${esc(d.echelle)}</div>
        <div class="title">${d.pid?`<span class="pid" title="N° post-it">${d.pid}</span>`:''}${d.num?`<span class="num">${esc(d.num)}</span>`:''}${esc(d.marque)} ${esc(d.modele)}</div>
        <div class="sub">${esc(d.pilote)}${d.pilote&&d.course?' — ':''}${esc(d.course)}</div>
        ${SHOW_ETAT&&d.etat?`<div class="sub">${esc(d.etat)}</div>`:''}
        ${d.notes?`<div class="sub"><i>${esc(d.notes)}</i></div>`:''}
        <div class="meta"><span>${esc(d.cat)} · ${esc(d.annee)}</span>
          <span class="price">${d.prix?d.prix.toFixed(0)+' €':'—'}${d.pmin&&d.pmax?`<small>(${d.pmin.toFixed(0)}–${d.pmax.toFixed(0)})</small>`:''}</span></div>
      </div>
    </article>`).join('');
  $('#empty').style.display = view.length?'none':'block';
  const total = view.reduce((s,d)=>s+d.prix,0);
  $('#count').textContent = `${DATA.length} modèles`;
  $('#stats').textContent = `${view.length} affiché${view.length>1?'s':''} · total estimé ${total.toFixed(0)} €`;
}
['fFab','fMarque','fCat','fEch','fSort'].forEach(id => $('#'+id).onchange = render);
$('#fQ').oninput = render;
$('#reset').onclick = () => { ['fFab','fMarque','fCat','fEch','fQ'].forEach(id=>$('#'+id).value=''); $('#fSort').value=DEFAULT_SORT; render(); };

// lightbox
let cur=0;
function show(i){ cur=(i+view.length)%view.length; const d=view[cur];
  $('#lbImg').src = 'medium/'+d.thumb; $('#lbCap').textContent = `${d.fab} ${d.ref} — ${d.marque} ${d.modele} · ${d.pilote} · ${d.prix.toFixed(0)} €`; $('#lb').classList.add('on'); }
$('#grid').addEventListener('click', e => { const t=e.target.closest('.img'); if(t) show(+t.dataset.i); });
$('#lb .x').onclick = ()=> $('#lb').classList.remove('on');
$('#lb').onclick = e => { if(e.target.id==='lb') $('#lb').classList.remove('on'); };
$('#lb .prev').onclick = ()=> show(cur-1); $('#lb .next').onclick = ()=> show(cur+1);
document.addEventListener('keydown', e => { if(!$('#lb').classList.contains('on')) return; if(e.key==='Escape') $('#lb').classList.remove('on'); if(e.key==='ArrowLeft') show(cur-1); if(e.key==='ArrowRight') show(cur+1); });
$('#tog').onclick = () => { const h=document.querySelector('header'); h.classList.toggle('open'); $('#tog').classList.toggle('on'); $('#tog').textContent = h.classList.contains('open') ? 'Filtres ▴' : 'Filtres ▾'; };
render();
</script>
</body>
</html>
